name: Publicar revisión Roraima

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generar artículos Silhouette cuya fecha haya llegado
        run: node scripts/publish-silhouette-blog.mjs
      - name: Preparar archivos públicos sin artículos programados
        run: |
          mkdir -p .site-artifact
          rsync -a --include='frame-0000.jpg' --exclude='frame-*.jpg' --exclude='/.git/' --exclude='/.github/' --exclude='/content/' --exclude='/scripts/' --exclude='/silhouette/assets/local-blog-preview.js' --exclude='/.site-artifact/' ./ .site-artifact/
          sed -i '/local-blog-preview.js/d' .site-artifact/silhouette/index.html
          node scripts/prepare-silhouette-pages-assets.mjs .site-artifact
      - name: Obtener catálogo JISCO aprobado
        uses: actions/checkout@v4
        with:
          repository: MoissesB/innova-jisco-catalogo
          ref: aa2a2e6d786a9ff59089226ad81566af7bf79d12
          path: .jisco-source
          persist-credentials: false
      - name: Integrar JISCO solo en el artefacto Roraima
        run: node scripts/prepare-roraima-jisco.mjs .jisco-source/public .site-artifact/jisco
      - name: Obtener catálogo AKONI aprobado
        uses: actions/checkout@v4
        with:
          repository: MoissesB/innova-akoni-catalogo
          ref: efb35180f7a93a0f323051a9eaec169b857642a0
          path: .akoni-source
          persist-credentials: false
      - name: Integrar AKONI solo en el artefacto Roraima
        run: node scripts/prepare-roraima-akoni.mjs .akoni-source/docs .site-artifact/akoni
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
