name: Publicar artículos programados de Silhouette

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revisar fechas y generar páginas públicas
        run: node scripts/publish-silhouette-blog.mjs
      - name: Detectar artículos nuevos
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- silhouette/blog sitemap.xml)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Guardar la publicación en main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silhouette/blog sitemap.xml
          git commit -m "Publish scheduled Silhouette blog articles"
          git push origin HEAD:main
      - name: Preparar archivos públicos
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p .site-artifact
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/content/' --exclude='/scripts/' --exclude='/silhouette/assets/local-blog-preview.js' --exclude='/.site-artifact/' ./ .site-artifact/
          sed -i '/local-blog-preview.js/d' .site-artifact/silhouette/index.html
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          path: .site-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.changes.outputs.changed == 'true'
